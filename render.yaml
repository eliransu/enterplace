# Deploy to Render: https://render.com/deploy?repo=https://github.com/eliransu/enterplace
# One web service from the published image and one Render Postgres. Render asks for the provider keys (fill at least
# one). The first start prints the admin key once in the service's logs; the console is at <service URL>/console.
# Keys and the policy live in Postgres, so a redeploy keeps them. The audit log is on the container's own disk and
# starts a new chain at each deploy: see https://docs.enterplace.dev/deploy/one-click/
services:
  - type: web
    name: enterplace
    runtime: image
    image:
      url: ghcr.io/eliransu/enterplace:latest
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: enterplace-db
          property: connectionString
      # Render's internal Postgres connection offers TLS with a self-signed certificate: encrypted, not verified.
      - key: PGSSLMODE
        value: require
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: enterplace-db
    plan: basic-256mb
    databaseName: enterplace
    user: enterplace
    postgresMajorVersion: "16"
