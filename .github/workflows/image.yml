# Builds the image for amd64 and arm64 and pushes it to ghcr.io/eliransu/gantry, a public package, tagged latest (main),
# with the commit sha (and the version, on a v* tag). On a pull request or a branch, it builds both and pushes nothing.
# On a v* tag it also checks that the repository names that version, and puts the image digest at the top of the
# GitHub Release of this repository (release.yml adds the signed tarballs). How to release: RELEASING.md.
# Every image is scanned (scripts/scan_image.sh: fails on a high or critical vulnerability not allowed in .grype.yaml).
# A published one is then signed with cosign, keyless (this workflow's GitHub OIDC identity, logged in Sigstore's
# public transparency log), with its SBOM and SLSA provenance attached as signed attestations. Customers check all
# three with scripts/verify_release.sh.
name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gantry
  COSIGN_VERSION: v3.1.4
  SYFT_VERSION: v1.46.0
  GRYPE_VERSION: v0.115.0
  PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Cargo.toml, CHANGELOG.md and the Helm chart name one version; on a v* tag, that tag's.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        # With tags and history: scripts/version.py compares the store migrations with the previous tag's.
        with:
          fetch-depth: 0
      # Strict on a tag. On a branch a mismatch is a warning, so a branch between releases still builds.
      - id: check
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then tag=${{ github.ref_name }}; fail() { echo "::error::$1"; exit 1; }
          else tag=; fail() { echo "::warning::$1"; }; fi
          python3 scripts/version.py $tag || fail "version check failed (above)"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 scripts/version.py --notes > release-notes.md || fail "no CHANGELOG section for $version"
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: version
    strategy:
      matrix:
        include:
          # Each architecture on its own kind of runner: a Rust build under QEMU emulation takes hours.
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # By digest: the merge job below puts both architectures under one tag.
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker,name=gantry:check' }}
      - name: Check the size and user
        if: env.PUBLISH != 'true'
        run: |
          size=$(docker image inspect gantry:check --format '{{.Size}}')
          echo "${{ matrix.platform }}: $size bytes"
          [ "$size" -lt $((50 * 1024 * 1024)) ]
          [ "$(docker image inspect gantry:check --format '{{.Config.User}}')" = 65532:65532 ]
      # One architecture is enough: both are built from one Cargo.lock, so they ship the same crates.
      - name: Scan the image
        if: env.PUBLISH != 'true' && matrix.platform == 'linux/amd64'
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin "$SYFT_VERSION"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin "$GRYPE_VERSION"
          scripts/scan_image.sh gantry:check
      - name: Keep the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          d="${{ steps.build.outputs.digest }}"
          touch "digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          retention-days: 1

  merge:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The OIDC token cosign trades for a short-lived Sigstore certificate naming this workflow and ref.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            # The newest build of main. Production pins a commit SHA or a version instead.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - name: One tag for both architectures
        working-directory: digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"
      - uses: sigstore/cosign-installer@v4
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # Scanned before it is signed: a failing scan leaves the image unsigned, and verify_release.sh refuses it.
      - name: Scan, sign, and attest the SBOM and provenance
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin "$SYFT_VERSION"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin "$GRYPE_VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" --format '{{json .Manifest}}' | jq -r .digest)
          ref="$IMAGE@$digest"
          scripts/scan_image.sh "$ref" sbom.cdx.json
          python3 scripts/signing.py predicate > provenance.json
          cosign sign --yes "$ref"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$ref"
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$ref"
          cosign verify "$ref" --certificate-identity "${{ github.server_url }}/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signed $ref"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # Its notes name the image by digest, which no later push can move.
  # release.yml makes the same release with the signed tarballs: whichever job comes first creates it, the other adds to it.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: The image digest in the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          [ -n "$digest" ] && [ "$digest" != null ] || { echo "::error::no image $IMAGE:$VERSION"; exit 1; }
          {
            echo "Image: \`$IMAGE:$VERSION\`"
            echo
            echo "Digest: \`$IMAGE@$digest\` (amd64 and arm64). Pin the digest in production."
            echo
            echo "Signed with cosign, with an SBOM and SLSA provenance attached: \`scripts/verify_release.sh $VERSION\` checks all three."
            echo
          } > image.md
          if gh release view "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --json body --jq .body > body.md 2>/dev/null; then
            cat image.md body.md > notes.md
            gh release edit "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --notes-file notes.md
          else
            cat image.md release-notes.md > notes.md
            gh release create "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --verify-tag \
              --title "Gantry $VERSION" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" sbom.cdx.json --repo "${{ github.repository }}" --clobber
