name: browser
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  console:
    # The console's forms in a real Chrome: the route tests set Origin by hand and cannot see what a browser sends.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --locked -p enterplace-cli
      - run: python3 scripts/browser_check.py --chrome "$(command -v google-chrome)"
