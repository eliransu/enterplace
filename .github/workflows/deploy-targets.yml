# Checks the deploy files without a cloud account: the Cloudflare template, the Terraform modules and the Compose guide.
# (deploy.yml deploys the docs site and the landing page.)
name: deploy-targets
on:
  push:
    branches: [main]
    paths: [deploy/compose/**, deploy/terraform/**, deploy/cloudflare/**, Dockerfile, crates/**, enterprise/**, Cargo.toml, Cargo.lock, docs/src/content/docs/deploy/docker.mdx, .github/workflows/deploy-targets.yml]
  pull_request:
    paths: [deploy/compose/**, deploy/terraform/**, deploy/cloudflare/**, Dockerfile, crates/**, enterprise/**, Cargo.toml, Cargo.lock, docs/src/content/docs/deploy/docker.mdx, .github/workflows/deploy-targets.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Cloudflare template's Worker type-checks against the pinned wrangler, containers and workers-types.
  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx tsc --noEmit

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [aws-ecs, gcp-cloud-run, azure-container-apps]
    defaults:
      run:
        working-directory: deploy/terraform/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false && terraform validate
      - working-directory: deploy/terraform/${{ matrix.module }}/examples/basic
        run: terraform init -backend=false -input=false && terraform validate
      # A plan with no cloud account: AWS and Google plan with fake credentials and their lookups skipped; azurerm
      # needs a real token first, so its example is planned through `terraform test` with the provider mocked.
      - working-directory: deploy/terraform/${{ matrix.module }}/examples/basic
        run: |
          if [ -d tests ]; then terraform test; else terraform plan -input=false -lock=false; fi

  # The Docker guide as a customer follows it: the files come from the docs page, the image from the registry.
  compose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/enterplace:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # image.yml publishes main only, and may still be building this commit: then the image is built here, from the
      # same checkout, and tagged with the name the registry would give it.
      - name: The image for this commit
        run: |
          if docker pull "$IMAGE"; then
            echo "pulled the published $IMAGE"
          else
            echo "$IMAGE is not published: building it here"
            docker build -t "$IMAGE" .
          fi
      - name: The Docker guide, from an empty folder
        run: ENTERPLACE_IMAGE="$IMAGE" deploy/compose/test/run.sh docs/src/content/docs/deploy/docker.mdx
