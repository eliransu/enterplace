name: deploy
# Deploys the docs (gantry-docs.enterplace.dev) and the landing page (gantry.enterplace.dev) to Cloudflare Workers.
# Needs the repository secret CLOUDFLARE_API_TOKEN: a token with "Workers Scripts: Edit" and
# "Workers Routes: Edit" on the account, and "DNS: Edit" on the enterplace.dev and eliran.me zones for the custom domains.
on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 7afb2802e1d6ba307ec13a57d1f3281f

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - run: npx wrangler deploy
        working-directory: docs

  site:
    # The landing page is built on a design machine and committed in site/public, so this only uploads it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes wrangler@4.161.0 deploy
        working-directory: site
