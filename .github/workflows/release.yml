name: release
# Package 7.2: a release is built twice and must be the same bytes, rolls back onto its own data, and is signed.
# On a v* tag the signed files go to a GitHub Release of this repository, with the CHANGELOG section as its
# notes, and the Homebrew formula goes to the tap eliransu/homebrew-tap. Every push to main of eliransu/gantry replaces
# the rolling pre-release `edge` with that commit's signed files (install.sh falls back to it before the first stable
# release). Run by hand (gh workflow run release.yml --ref <branch>) it is a dry run: every step but the publishing.
# The binaries: linux amd64 and arm64 (static musl, built twice and compared byte for byte) and macOS arm64 and amd64
# (built once on their own runners: not checked for reproducibility).
# How to release: RELEASING.md. image.yml adds the image digest to the same release.
# The Helm chart goes to ghcr.io/<owner>/charts/gantry as an OCI artifact, signed with cosign keyless (this workflow's
# GitHub OIDC identity). scripts/verify_release.sh checks it beside the image.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

# One edge publish at a time; a newer push to main supersedes an older one still running. Tags never cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  version:
    # Pushes to main publish edge on the public repository only; elsewhere they start nothing.
    if: github.event_name != 'push' || github.ref_type == 'tag' || github.repository == 'eliransu/gantry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # With tags and history: scripts/version.py compares the store migrations with the previous tag's.
        with:
          fetch-depth: 0
      # A tag must be v<Cargo.toml version> with a dated CHANGELOG section. A dry run dates the section in this
      # runner only, as `scripts/release.sh bump` does before a real tag, and checks the result the same way.
      - name: The tag, Cargo.toml and CHANGELOG.md agree
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${{ github.ref_type }}" = tag ]; then
            python3 scripts/version.py "${{ github.ref_name }}"
          else
            echo "dry run: dating CHANGELOG $version in this runner only"
            scripts/release.sh bump "$version"
            python3 scripts/version.py "v$version"
          fi
          python3 scripts/version.py --notes > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    needs: version
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3
      # Two builds from scratch on this platform, compared byte for byte.
      - if: runner.os == 'Linux'
        run: PLATFORMS=${PLATFORM#linux-} scripts/release.sh reproduce
        env:
          PLATFORM: ${{ matrix.platform }}
      # One native build: the same enterprise binary (the open source edition without a key), for macOS 11 and later.
      # Paths are remapped as in the Dockerfile; the byte-for-byte check is linux only.
      - if: runner.os == 'macOS'
        run: |
          export RUSTFLAGS="--remap-path-prefix=$PWD=. --remap-path-prefix=$HOME/.cargo=cargo"
          scripts/release.sh tarball
          tar -tzf dist/gantry-*.tar.gz
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/gantry-*
          if-no-files-found: error

  rollback:
    needs: version
    runs-on: ubuntu-latest
    # The mixed-version check runs both versions on this database at once.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The version before this one: the previous tag, or the previous commit before the first tag.
      - run: |
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-parse HEAD^)
          echo "previous: $previous"
          git worktree add ../previous "$previous"
          (cd ../previous && cargo build --release --locked -q -p gantry-cli)
          cargo build --release --locked -q -p gantry-cli
          python3 scripts/rollback_check.py ../previous/target/release/gantry target/release/gantry
          # A rolling upgrade: the previous version and this one serve from one Postgres at the same time.
          DATABASE_URL='postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable' \
            python3 scripts/mixed_version_check.py ../previous/target/release/gantry target/release/gantry

  # The chart as a signed OCI artifact. A dry run packages and lints it and pushes nothing.
  chart:
    needs: [build, rollback]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      CHARTS: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: sigstore/cosign-installer@v4
        with:
          cosign-release: v3.1.4
      - name: Package, push and sign the chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          helm lint --strict deploy/helm/gantry
          helm package deploy/helm/gantry -d chart
          ls -l chart
          if [ "${{ github.ref_type }}" != tag ]; then
            echo "dry run: would push chart/*.tgz to oci://$CHARTS and sign it"
            exit 0
          fi
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          out=$(helm push chart/gantry-*.tgz "oci://$CHARTS" 2>&1); echo "$out"
          digest=$(sed -n 's/^Digest: //p' <<< "$out")
          [ -n "$digest" ] || { echo "::error::helm push printed no digest"; exit 1; }
          cosign sign --yes "$CHARTS/gantry@$digest"
          cosign verify "$CHARTS/gantry@$digest" --certificate-identity "${{ github.server_url }}/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signed $CHARTS/gantry@$digest"

  sign:
    needs: [build, rollback]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is not set. Set it to the release private key: gh secret set RELEASE_SIGNING_KEY < <key file>"
            exit 1
          fi
          scripts/release.sh sign
          scripts/release.sh verify
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: dist/
          if-no-files-found: error

  # The release, its notes and the signed files are public, as the repository is.
  publish:
    needs: [sign, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: GitHub Release with the signed files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          # A push to main: the rolling pre-release edge, deleted and made again on this commit with its files.
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_type }}" = branch ]; then
            gh release delete edge --repo "$REPO" --cleanup-tag --yes 2> /dev/null || true
            gh release create edge dist/* --repo "$REPO" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Gantry edge (main ${GITHUB_SHA::12})" \
              --notes "Rolling pre-release, rebuilt on every push to main: commit $GITHUB_SHA. Not a stable release; pin a vX.Y.Z tag in production. Install: GANTRY_VERSION=edge, see install.sh."
            exit 0
          fi
          if [ "${{ github.ref_type }}" != tag ]; then
            echo "dry run: would create release $TAG of ${{ github.repository }} with the files above and these notes:"
            cat release-notes.md
            exit 0
          fi
          # image.yml may have made the release first, with the image digest: then the files are added to it.
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist/* --repo "${{ github.repository }}" --verify-tag \
              --title "Gantry ${TAG#v}" --notes-file release-notes.md
          fi

  # The Homebrew formula of a stable release, rendered from packaging/homebrew/gantry.rb with this release's URLs and
  # hashes and pushed to the tap eliransu/homebrew-tap. A dry run renders and prints it. Edge has no formula.
  homebrew:
    needs: publish
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: dist
      - name: Render and push the formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then tag=${{ github.ref_name }}; else tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1); fi
          packaging/homebrew/render.sh dist "$tag" > gantry.rb
          cat gantry.rb
          if [ "${{ github.ref_type }}" != tag ]; then
            echo "dry run: would push Formula/gantry.rb to eliransu/homebrew-tap"
            exit 0
          fi
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, so the formula was not pushed. Create the public repo eliransu/homebrew-tap, then: gh secret set HOMEBREW_TAP_TOKEN --repo eliransu/gantry (a fine-grained token with contents write on the tap)."
            exit 0
          fi
          git clone -q "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/eliransu/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp gantry.rb tap/Formula/gantry.rb
          cd tap
          git add Formula/gantry.rb
          if git diff --cached --quiet; then echo "the tap already has this formula"; exit 0; fi
          git -c user.name="gantry release" -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "gantry ${tag#v}"
          git push -q origin HEAD
          echo "pushed Formula/gantry.rb for ${tag#v}: brew install eliransu/tap/gantry"
