name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gantry-enterprise
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gantry
          path: gantry
          # The open source repository is private for now, and the default token reads only this one.
          # GANTRY_REPO_TOKEN: a fine-grained token with contents:read on ggantry/gantry.
          token: ${{ secrets.GANTRY_REPO_TOKEN || github.token }}
      - working-directory: gantry-enterprise
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked
          cargo test --all-features --locked
