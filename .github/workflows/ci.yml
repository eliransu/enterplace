name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Run by hand on a branch: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # The store tests run against a real Postgres: two gateways on one database, a budget across both, an outage.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          # The enterprise suite opens more than the default 100 connections. A service container takes no command,
          # so initdb (Postgres 16 and later) writes the setting into postgresql.conf.
          POSTGRES_INITDB_ARGS: "-c max_connections=300"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      GANTRY_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        # With tags and history: scripts/version.py compares the store migrations with the previous tag's.
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # fmt, clippy -D warnings, tests, release build, the policy examples, the bench gate and the docs build:
      # the same script a developer runs before pushing, so CI and a laptop cannot disagree.
      # Shared CI machines are noisy, so the bench runs at 1,000 requests a second rather than the 5,000 used locally.
      # The limit stays at the plan's target: 1,000 microseconds at p99.
      - run: scripts/ci.sh
      # The screenshots of the new user's path (scripts/ftue_check.py, run by ci.sh with the runner's Chrome).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ftue-screens
          path: target/ftue-screens
          if-no-files-found: ignore
      - name: The binary answers
        run: |
          ./target/release/gantry serve --unchecked &
          for i in 1 2 3 4 5; do curl -sf http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          exit 1
      - name: The release tarball builds
        run: scripts/release.sh tarball

  console-edit:
    # The console's editing pages (models, keys, policy versions, approval, dry run) in a real headless Chrome
    # against Postgres, with a screenshot of each.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --locked -p gantry-cli
      - run: >-
          python3 scripts/console_edit_check.py --fresh --chrome "$(command -v google-chrome)"
          --database "postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-edit-screens
          path: target/console-edit-screens
          if-no-files-found: ignore

  install:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The open source crates, without enterprise/: they must build and pass on their own.
      - run: cargo test --locked --workspace --exclude gantry-enterprise

  device-agent:
    # The device agent (gantry device) runs on employee machines, so the enterprise binary builds and the agent's
    # unit tests pass on Linux and on Windows, where its paths and installer are checked too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: The agent's unit tests
        run: cargo test --locked -p gantry-enterprise device::tests
      - name: The Linux installer parses
        if: runner.os == 'Linux'
        run: sh -n deploy/mdm/install-linux.sh
      - name: The Windows installer parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/deploy/mdm/windows/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: The agent builds for Windows on arm64
        if: runner.os == 'Windows'
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check --locked -p gantry-enterprise --target aarch64-pc-windows-msvc
      # The binary deploy/mdm/windows/install.ps1 installs, kept from runs on main and runs by hand.
      - name: The Windows binary
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: cargo build --release --locked -p gantry-enterprise
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        with:
          name: gantry-enterprise-windows-x86_64
          path: target/release/gantry-enterprise.exe

  # install.sh (curl ... | sh) against a fake signed release on localhost, under sh and dash, and shellcheck clean.
  install-script:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh scripts/install_check.sh
      - run: scripts/install_check.sh
      - if: runner.os == 'Linux'
        run: INSTALL_SH=dash scripts/install_check.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
