name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gantry-enterprise
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gantry
          path: gantry
          # The open source repository is private: GANTRY_REPO_TOKEN is a token that can read it.
          token: ${{ secrets.GANTRY_REPO_TOKEN || github.token }}
      - working-directory: gantry-enterprise
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
