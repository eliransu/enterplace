name: artifacthub
# Pushes deploy/helm/artifacthub-repo.yml beside the chart, as the `artifacthub.io` tag Artifact Hub reads to mark the
# repository as a Verified Publisher. Run by hand on main once, and again whenever that file changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
      - name: Push the repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd deploy/helm
          oras push "ghcr.io/${{ github.repository_owner }}/charts/enterplace:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
