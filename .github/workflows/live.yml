name: live
# The live provider matrix (scripts/live_matrix.py): every route Enterplace serves against each real provider kind, with
# a token cap per run. A provider whose secrets are not set is skipped and says so. The matrix is this run's job summary
# and its live-matrix artifact; docs/src/data/live-matrix.json is updated from an artifact by hand (see the docs page
# Providers > Live test matrix), so no workflow writes to main.
on:
  # A change to the suite runs it on its branch: workflow_dispatch only works once this file is on main.
  push:
    paths: [scripts/live_matrix.py, .github/workflows/live.yml]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      max_tokens:
        description: Token cap for the whole run
        default: "20000"

permissions:
  contents: read

# One run at a time, so two runs never spend at once.
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked -p enterplace-cli
      - name: Run every route against every provider with keys
        env:
          ENTERPLACE_LIVE_MAX_TOKENS: ${{ inputs.max_tokens || '20000' }}
          ENTERPLACE_LIVE_OPENAI_KEY: ${{ secrets.ENTERPLACE_LIVE_OPENAI_KEY }}
          ENTERPLACE_LIVE_ANTHROPIC_KEY: ${{ secrets.ENTERPLACE_LIVE_ANTHROPIC_KEY }}
          ENTERPLACE_LIVE_AZURE_KEY: ${{ secrets.ENTERPLACE_LIVE_AZURE_KEY }}
          ENTERPLACE_LIVE_AZURE_URL: ${{ secrets.ENTERPLACE_LIVE_AZURE_URL }}
          ENTERPLACE_LIVE_AZURE_DEPLOYMENT: ${{ secrets.ENTERPLACE_LIVE_AZURE_DEPLOYMENT }}
          ENTERPLACE_LIVE_AWS_ACCESS_KEY_ID: ${{ secrets.ENTERPLACE_LIVE_AWS_ACCESS_KEY_ID }}
          ENTERPLACE_LIVE_AWS_SECRET_ACCESS_KEY: ${{ secrets.ENTERPLACE_LIVE_AWS_SECRET_ACCESS_KEY }}
          ENTERPLACE_LIVE_GEMINI_KEY: ${{ secrets.ENTERPLACE_LIVE_GEMINI_KEY }}
          ENTERPLACE_LIVE_VERTEX_SA_JSON: ${{ secrets.ENTERPLACE_LIVE_VERTEX_SA_JSON }}
          ENTERPLACE_LIVE_GROQ_KEY: ${{ secrets.ENTERPLACE_LIVE_GROQ_KEY }}
          ENTERPLACE_LIVE_MISTRAL_KEY: ${{ secrets.ENTERPLACE_LIVE_MISTRAL_KEY }}
        run: python3 scripts/live_matrix.py --enterplace target/release/enterplace --out live-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-matrix
          path: live-matrix.json
          if-no-files-found: warn
