# A starting policy for Gantry on Cloudflare. Keep the last two lines: the audit log on the container's disk (the
# gateway seals it into R2), and the store, which every gateway instance shares.
version: 1
providers:
  - name: openai
    kind: openai
    url: https://api.openai.com/v1
    key_env: OPENAI_PROVIDER_KEY
    models: [gpt-4o-mini]
rules:
  - name: everyone
    principals: { any: true }
    models: [gpt-4o-mini]
audit: { path: /var/lib/gantry/gantry-audit.jsonl }
# Keys, kill switches and budgets live in Postgres. The Workers secret DATABASE_URL holds the connection string.
store: { postgres_url_env: DATABASE_URL }
