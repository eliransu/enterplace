# Enterplace and Postgres on one machine, from the published image, in one command:
#   mkdir enterplace && cd enterplace && curl -fsSLO https://raw.githubusercontent.com/eliransu/enterplace/main/deploy/compose/compose.yaml && OPENAI_API_KEY=sk-... docker compose up -d
# The admin key, printed once: docker compose logs enterplace | grep ENTERPLACE_KEY
# The console: http://localhost:8080/console
# Provider keys are read from the shell or a .env file beside this one (OPENAI_API_KEY, ANTHROPIC_API_KEY,
# GEMINI_API_KEY). The full guide, with your own policy file: https://docs.enterplace.dev/deploy/docker/
name: enterplace

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: enterplace
      # Only Enterplace reaches this database: it shares this container's network and publishes no Postgres port.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enterplace}
      POSTGRES_DB: enterplace
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${ENTERPLACE_BIND:-127.0.0.1}:${ENTERPLACE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "enterplace", "-d", "enterplace"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  enterplace:
    image: ${ENTERPLACE_IMAGE:-ghcr.io/eliransu/enterplace:latest}
    network_mode: service:postgres
    environment:
      DATABASE_URL: postgres://enterplace:${POSTGRES_PASSWORD:-enterplace}@localhost:5432/enterplace?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENTERPLACE_LICENSE: ${ENTERPLACE_LICENSE:-}
    volumes:
      # The policy start writes and the hash-chained audit log.
      - enterplace-data:/var/lib/enterplace
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  enterplace-data:
