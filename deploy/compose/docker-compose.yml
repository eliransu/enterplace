# Gantry on one machine: the gateway and Postgres 16, each with its own named volume.
# Start: see README.md. Run from this folder; `build:` expects the folder that holds both repositories three levels up.
name: gantry

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gantry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gantry
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Gantry shares this container's network (network_mode below), so its port is published here.
    ports:
      - "${GANTRY_BIND:-127.0.0.1}:${GANTRY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gantry", "-d", "gantry"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  gantry:
    image: ${GANTRY_IMAGE:-ghcr.io/ggantry/gantry-enterprise:latest}
    build:
      context: ../../..
      dockerfile: gantry-enterprise/Dockerfile
    # Set explicitly: the image's default command has been the retired node mode.
    command: ["serve", "/etc/gantry/gantry.policy.yaml", "--keys", "/var/lib/gantry/gantry.keys.yaml", "--listen", "0.0.0.0:8080"]
    # Sharing Postgres's network namespace keeps the database off every network but this pair of containers, so the
    # connection is plain (sslmode=disable). Gantry warns at start that it is not encrypted; on one host that is expected.
    network_mode: service:postgres
    environment:
      DATABASE_URL: postgres://gantry:${POSTGRES_PASSWORD}@localhost:5432/gantry?sslmode=disable
      OPENAI_PROVIDER_KEY: ${OPENAI_PROVIDER_KEY:-}
      GANTRY_LICENSE: ${GANTRY_LICENSE:-}
    volumes:
      - ${GANTRY_POLICY:-./gantry.policy.yaml}:/etc/gantry/gantry.policy.yaml:ro
      # The audit log and, without a store, the keys file. One volume per gateway: each writes its own hash chain.
      - gantry-data:/var/lib/gantry
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # 30 s for requests in flight after SIGTERM, plus margin, so the audit log is synced before the stop.
    stop_grace_period: 40s
    # Postgres restarting takes Gantry's network with it; restarting brings Gantry back on the new one.
    restart: unless-stopped

  # The `gantry` command line (key new, audit verify) from the open source image, on the same network and volume.
  # ponytail: a second image until the enterprise image carries these commands; then this service goes away.
  cli:
    profiles: [tools, test]
    image: ${GANTRY_CLI_IMAGE:-gantry:local}
    build:
      context: ../../../gantry
    network_mode: service:postgres
    environment:
      DATABASE_URL: postgres://gantry:${POSTGRES_PASSWORD}@localhost:5432/gantry?sslmode=disable
    volumes:
      - ${GANTRY_POLICY:-./gantry.policy.yaml}:/etc/gantry/gantry.policy.yaml:ro
      - gantry-data:/var/lib/gantry
    depends_on:
      postgres:
        condition: service_healthy

  # An OpenAI-compatible model server that answers every chat request the same way, for the test only.
  mock:
    profiles: [test]
    image: python:3.12-alpine
    command: ["python", "/mock.py"]
    volumes:
      - ./test/mock.py:/mock.py:ro

volumes:
  postgres-data:
  gantry-data:
