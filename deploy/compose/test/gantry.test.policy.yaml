# The Compose test: the starting policy with the mock model server in place of OpenAI.
version: 1
providers:
  - name: mock
    kind: openai
    url: http://mock:9000/v1
    # The mock is on the Compose network, a private address Gantry refuses unless told.
    allow_private: true
    models: [mock-model]
rules:
  - name: everyone
    principals: { any: true }
    models: [mock-model]
audit: { path: /var/lib/gantry/gantry-audit.jsonl }
store: { postgres_url_env: DATABASE_URL }
