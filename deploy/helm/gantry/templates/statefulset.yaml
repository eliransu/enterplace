{{- $store := or (regexMatch "(?m)^store:" .Values.policy) (ne .Values.existingPolicyConfigMap "") }}
{{- if and (gt (int .Values.replicaCount) 1) (not $store) }}
{{- fail "replicaCount above 1 needs the policy's `store:` section: without it each replica counts budgets from zero and keeps its own keys and kill switches. Add `store: { postgres_url_env: DATABASE_URL }` to policy, or set replicaCount to 1." }}
{{- end }}
{{- if and .Values.postgres.enabled (not $store) }}
{{- fail "postgres.enabled starts a database that nothing uses until the policy has `store: { postgres_url_env: DATABASE_URL }`. Add it to policy." }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gantry.fullname" . }}
  labels:
    {{- include "gantry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "gantry.fullname" . }}
  # Replicas do not depend on each other: start and stop them together, not one by one.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "gantry.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gantry.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # On SIGTERM Gantry answers /readyz with 503 at once and finishes requests in flight, for up to 30 seconds.
      # Readiness fails within two 5 second probes, so the endpoint drops the pod before that ends; 45 seconds leaves
      # room for both and the final audit sync. No preStop hook: the drain is Gantry's own.
      terminationGracePeriodSeconds: 45
      initContainers:
        # `serve --keys` needs the keys file to exist. On a new volume this writes the seed keys file, or an empty
        # list. An existing file is never touched: keys issued since then live there.
        - name: keys-file
          image: {{ .Values.keys.initImage }}
          command:
            - sh
            - -c
            - |
              f=/var/lib/gantry/gantry.keys.yaml
              [ -e "$f" ] && exit 0
              umask 077
              if [ -e /seed/gantry.keys.yaml ]; then cp /seed/gantry.keys.yaml "$f"; else printf 'keys: []\n' > "$f"; fi
          securityContext:
            {{- include "gantry.containerSecurity" . | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gantry
            {{- if .Values.keys.existingSecret }}
            - name: seed-keys
              mountPath: /seed
              readOnly: true
            {{- end }}
      containers:
        - name: gantry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - /etc/gantry/gantry.policy.yaml
            - --keys
            - /var/lib/gantry/gantry.keys.yaml
            - --listen
            - 0.0.0.0:8080
            {{- if .Values.metrics.enabled }}
            - --metrics
            - 0.0.0.0:{{ .Values.metrics.port }}
            {{- end }}
          {{- if or .Values.envFromSecrets .Values.postgres.enabled }}
          envFrom:
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          env:
            {{- if .Values.postgres.enabled }}
            # After envFromSecrets, so the trial database wins over a DATABASE_URL in your own Secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gantry.fullname" . }}-postgres
                  key: DATABASE_URL
            {{- end }}
            {{- if .Values.masterKey.existingSecret }}
            - name: GANTRY_MASTER_KEY_FILE
              value: /etc/gantry-master/{{ .Values.masterKey.key }}
            {{- end }}
            {{- if .Values.exportKey.existingSecret }}
            - name: GANTRY_EXPORT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.exportKey.existingSecret }}
                  key: {{ .Values.exportKey.key }}
            {{- end }}
            {{- range $name, $value := .Values.otel }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.proxy.https }}
            - name: HTTPS_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          # /readyz is 503 while a request would be refused (the store unreachable, no keys, draining after SIGTERM);
          # /healthz only when the audit log cannot be written, which a restart fixes.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            {{- include "gantry.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # A folder, not a subPath: a subPath mount never sees ConfigMap updates, so the policy could not reload.
            - name: policy
              mountPath: /etc/gantry
              readOnly: true
            - name: data
              mountPath: /var/lib/gantry
            {{- if .Values.masterKey.existingSecret }}
            - name: master-key
              mountPath: /etc/gantry-master
              readOnly: true
            {{- end }}
      volumes:
        - name: policy
          configMap:
            name: {{ .Values.existingPolicyConfigMap | default (printf "%s-policy" (include "gantry.fullname" .)) }}
        {{- if .Values.masterKey.existingSecret }}
        - name: master-key
          secret:
            secretName: {{ .Values.masterKey.existingSecret }}
            items:
              - key: {{ .Values.masterKey.key }}
                path: {{ .Values.masterKey.key }}
            # Readable by the pod's group (fsGroup 65532) only.
            defaultMode: 0440
        {{- end }}
        {{- if .Values.keys.existingSecret }}
        - name: seed-keys
          secret:
            secretName: {{ .Values.keys.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # The audit log is the record of every AI request: uninstalling or scaling down must not delete it.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "gantry.selector" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
