apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterplace.fullname" . }}
  labels:
    {{- include "enterplace.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "enterplace.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
{{- if .Values.admin.enabled }}
---
# The console, the admin API and /metrics: a Service of its own, never behind the chart's Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterplace.fullname" . }}-admin
  labels:
    {{- include "enterplace.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "enterplace.selector" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.admin.port }}
      targetPort: admin
{{- end }}
