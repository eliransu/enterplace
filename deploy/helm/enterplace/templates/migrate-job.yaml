{{- if .Values.migrations.job.enabled }}
# `enterplace store migrate` before the pods of an install or upgrade start: they run with --no-migrate and change no
# table. Hooks run before the release's own ConfigMap exists, so the Job has a copy of the policy of its own.
{{- if not .Values.existingPolicyConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "enterplace.fullname" . }}-migrate-policy
  labels:
    {{- include "enterplace.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  enterplace.policy.yaml: |
    {{- .Values.policy | nindent 4 }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "enterplace.fullname" . }}-migrate
  labels:
    {{- include "enterplace.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - store
            - migrate
            - --policy
            - /etc/enterplace/enterplace.policy.yaml
          {{- with (.Values.migrations.job.envFromSecrets | default .Values.envFromSecrets) }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if .Values.masterKey.existingSecret }}
          env:
            - name: ENTERPLACE_MASTER_KEY_FILE
              value: /etc/enterplace-master/{{ .Values.masterKey.key }}
          {{- end }}
          securityContext:
            {{- include "enterplace.containerSecurity" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: policy
              mountPath: /etc/enterplace
              readOnly: true
            {{- if .Values.masterKey.existingSecret }}
            - name: master-key
              mountPath: /etc/enterplace-master
              readOnly: true
            {{- end }}
      volumes:
        - name: policy
          configMap:
            name: {{ .Values.existingPolicyConfigMap | default (printf "%s-migrate-policy" (include "enterplace.fullname" .)) }}
        {{- if .Values.masterKey.existingSecret }}
        - name: master-key
          secret:
            secretName: {{ .Values.masterKey.existingSecret }}
            items:
              - key: {{ .Values.masterKey.key }}
                path: {{ .Values.masterKey.key }}
            defaultMode: 0440
        {{- end }}
{{- end }}
