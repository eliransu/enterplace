{{- if .Values.autoscaling.enabled }}
{{- $store := or (regexMatch "(?m)^store:" .Values.policy) (ne .Values.existingPolicyConfigMap "") }}
{{- if not $store }}
{{- fail "autoscaling.enabled runs more than one replica, which needs the policy's `store:` section: without it each replica counts budgets from zero and keeps its own keys and kill switches. Add `store: { postgres_url_env: DATABASE_URL }` to policy, or turn autoscaling off." }}
{{- end }}
{{- if lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas) }}
{{- fail "autoscaling.maxReplicas is below autoscaling.minReplicas. Set maxReplicas to at least minReplicas." }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "enterplace.fullname" . }}
  labels:
    {{- include "enterplace.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "enterplace.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- with .Values.autoscaling.podMetric }}
    {{- if .name }}
    # A per-pod metric served by a custom metrics API (for example prometheus-adapter mapping a rate or quantile of
    # enterplace_overhead_seconds from /metrics). Without that API the HPA reports the metric as unavailable and scales on
    # CPU alone.
    - type: Pods
      pods:
        metric:
          name: {{ .name }}
        target:
          type: AverageValue
          averageValue: {{ .targetAverageValue | quote }}
    {{- end }}
    {{- end }}
{{- end }}
