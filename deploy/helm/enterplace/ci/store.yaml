# Three replicas sharing keys, budgets and kill switches through the trial Postgres.
replicaCount: 3
postgres:
  enabled: true
policy: |
  version: 1
  providers:
    - name: openai
      kind: openai
      url: https://api.openai.com/v1
      key_env: OPENAI_PROVIDER_KEY
      models: [gpt-4o-mini]
  rules:
    - name: everyone
      principals: { any: true }
      models: [gpt-4o-mini]
  store: { postgres_url_env: DATABASE_URL }
  audit: { path: /var/lib/enterplace/enterplace-audit.jsonl }
