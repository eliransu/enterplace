# Autoscaling on CPU and a custom per-pod metric, with the trial Postgres as the store.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  podMetric:
    name: enterplace_overhead_seconds_p99
    targetAverageValue: 2m
metrics:
  enabled: true
postgres:
  enabled: true
policy: |
  version: 1
  providers:
    - name: openai
      kind: openai
      url: https://api.openai.com/v1
      key_env: OPENAI_PROVIDER_KEY
      models: [gpt-4o-mini]
  rules:
    - name: everyone
      principals: { any: true }
      models: [gpt-4o-mini]
  store: { postgres_url_env: DATABASE_URL }
  audit: { path: /var/lib/enterplace/enterplace-audit.jsonl }
