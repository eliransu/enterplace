# A tiny OpenAI-compatible provider for the kind test: every chat call gets one short answer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-provider
data:
  mock.py: |
    import http.server, json
    class Mock(http.server.BaseHTTPRequestHandler):
        def do_POST(self):
            self.rfile.read(int(self.headers.get("Content-Length", 0)))
            out = json.dumps({"id": "chatcmpl-mock", "object": "chat.completion", "model": "gpt-4o-mini",
                              "choices": [{"index": 0, "finish_reason": "stop",
                                           "message": {"role": "assistant", "content": "ok"}}],
                              "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2}}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(out)))
            self.end_headers()
            self.wfile.write(out)
    http.server.ThreadingHTTPServer(("0.0.0.0", 8000), Mock).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-provider
spec:
  selector:
    matchLabels: { app: mock-provider }
  template:
    metadata:
      labels: { app: mock-provider }
    spec:
      containers:
        - name: mock
          image: python:3.12-alpine
          command: [python, -u, /app/mock.py]
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 2
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes:
        - name: app
          configMap: { name: mock-provider }
---
apiVersion: v1
kind: Service
metadata:
  name: mock-provider
spec:
  selector: { app: mock-provider }
  ports: [{ port: 8000 }]
