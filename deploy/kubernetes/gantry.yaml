# Gantry on Kubernetes without Helm: the chart in deploy/helm/gantry with its default values and metrics on, written out by hand.
# Apply after making the provider key Secret:
#   kubectl create secret generic gantry-provider-keys --from-literal=OPENAI_PROVIDER_KEY=sk-...
#   kubectl apply -f deploy/kubernetes/gantry.yaml
# ONE replica: the audit log is one hash chain in one file on one ReadWriteOnce volume. See https://ggantry.github.io/gantry/operations/kubernetes/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gantry-policy
  labels: { app.kubernetes.io/name: gantry }
data:
  gantry.policy.yaml: |
    version: 1
    providers:
      - name: openai
        kind: openai
        url: https://api.openai.com/v1
        key_env: OPENAI_PROVIDER_KEY
        models: [gpt-4o-mini]
    rules:
      - name: everyone
        principals: { any: true }
        models: [gpt-4o-mini]
    audit: { path: /var/lib/gantry/gantry-audit.jsonl }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gantry-data
  labels: { app.kubernetes.io/name: gantry }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gantry
  labels: { app.kubernetes.io/name: gantry }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: gantry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gantry }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 40
      initContainers:
        # `serve --keys` needs the keys file to exist: on a new volume this writes an empty list. An existing file is never touched.
        - name: keys-file
          image: busybox:1.36.1
          command: ["sh", "-c", "[ -e /var/lib/gantry/gantry.keys.yaml ] || { umask 077; printf 'keys: []\\n' > /var/lib/gantry/gantry.keys.yaml; }"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 8Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/gantry }
      containers:
        - name: gantry
          image: gantry:local
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - /etc/gantry/policy/gantry.policy.yaml
            - --keys
            - /var/lib/gantry/gantry.keys.yaml
            - --listen
            - 0.0.0.0:8080
            - --metrics
            - 0.0.0.0:9464
          envFrom:
            - secretRef: { name: gantry-provider-keys }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9464 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: policy, mountPath: /etc/gantry/policy, readOnly: true }
            - { name: data, mountPath: /var/lib/gantry }
      volumes:
        - name: policy
          configMap: { name: gantry-policy }
        - name: data
          persistentVolumeClaim: { claimName: gantry-data }
---
apiVersion: v1
kind: Service
metadata:
  name: gantry
  labels: { app.kubernetes.io/name: gantry }
spec:
  selector: { app.kubernetes.io/name: gantry }
  ports:
    - { name: http, port: 8080, targetPort: http }
    # /metrics takes no key: keep this port off any Ingress.
    - { name: metrics, port: 9464, targetPort: metrics }
