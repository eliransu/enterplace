[package]
name = "gantry-server"
description = "HTTP server of the Gantry AI gateway."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gantry-core.workspace = true
gantry-console.workspace = true
axum.workspace = true
tokio.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tower.workspace = true
hyper-rustls.workspace = true
tokio-rustls.workspace = true
http-body-util.workspace = true
tokio-postgres.workspace = true
webpki-roots.workspace = true
# Answers are passed on frame by frame (Bedrock streams decoded, usage read as it passes): that needs a body type of Gantry's own.
http-body.workspace = true
# AES-256-GCM for provider credentials in the store, and the RS256 JWT that trades a Google service account key for
# a Vertex AI token. Already in the build through rustls and the console; named here to call it directly.
ring = "0.17"
tokio-tungstenite.workspace = true
futures-util.workspace = true

[dev-dependencies]
futures-core = "0.3"
# A WebSocket client for the realtime tests.
tokio-tungstenite = { workspace = true, features = ["connect"] }

[lints]
workspace = true
