[package]
name = "gantry-cli"
description = "The `gantry` binary: server and command line in one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gantry"
path = "src/main.rs"

[dependencies]
gantry-core.workspace = true
gantry-server.workspace = true
# `gantry login`, `logout` and `kill` call a running Gantry with the console's HTTP client.
gantry-console.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# The store tests make a fresh database for each test. Already a dependency of gantry-server.
tokio-postgres.workspace = true

[lints]
workspace = true

[build-dependencies]
# The source hash in `gantry version`. Already a dependency of gantry-core.
sha2.workspace = true
