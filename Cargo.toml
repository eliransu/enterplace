[workspace]
resolver = "3"
members = ["crates/enterplace-core", "crates/enterplace-server", "crates/enterplace-cli", "crates/enterplace-bench", "crates/enterplace-console", "enterprise"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
enterplace-core = { path = "crates/enterplace-core", version = "0.2.0" }
enterplace-server = { path = "crates/enterplace-server", version = "0.2.0" }
enterplace-console = { path = "crates/enterplace-console", version = "0.2.0" }
enterplace-cli = { path = "crates/enterplace-cli", version = "0.2.0" }
# `ws`: realtime sessions (OpenAI Realtime, Gemini Live) are WebSocket connections callers open to Enterplace.
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio", "server-auto", "server-graceful", "service"] }
http-body-util = "0.1"
http-body = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tower = { version = "0.5", features = ["util"] }
# Policy and keys files are YAML. serde-saphyr is pure safe Rust with alias expansion limits (unsafe-libyaml is unmaintained).
serde-saphyr = "1.1"
# SHA-256 for key hashes and the audit chain.
sha2 = "0.10"
# HMAC-SHA256 for AWS Signature Version 4, to sign requests to Amazon Bedrock.
hmac = "0.12"
# Operating system randomness for keys and decision IDs.
getrandom = "0.3"
# TLS to providers, with the Mozilla root set compiled in so a container needs no system certificates.
# Guardrail detectors: finite automata, so matching time is linear in the prompt whatever it contains.
regex = { version = "1", default-features = false, features = ["std", "perf"] }
# Enterplace's own TLS listener (`serve --tls-cert`). Already in the build through hyper-rustls; named here to accept connections.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The Postgres store (`store:` in the policy): the wire protocol, async on the tokio runtime Enterplace already runs on.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
# The Mozilla roots the store trusts, with an sslrootcert file's beside them. Already in the build through hyper-rustls.
webpki-roots = "1"
# Budget periods aligned to a time zone (`tz:` on a budget), daylight saving included. The zone database is bundled:
# the release image is FROM scratch and has no /usr/share/zoneinfo.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Realtime sessions (OpenAI Realtime, Gemini Live) are WebSocket: the client side to the provider. The same version
# axum's `ws` feature already brings in for the side callers connect to.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# Splitting a WebSocket into its two directions to relay both at once. Already in the build through tokio-tungstenite.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# `http2`: OTLP/gRPC trace export is HTTP/2 from the first byte (traces.rs). No new crate: h2 is already in the build
# through axum and hyper-util.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-tokio", "tls12"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Guardrails scan every prompt; unoptimized regex engines would make debug builds and tests misleadingly slow.
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
