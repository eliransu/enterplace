name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The enterprise features keep their tables in the store's Postgres; their tests run against a real one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      GANTRY_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          path: gantry-enterprise
      # The open source branch with this branch's name when there is one, else main: a change that spans both
      # repositories is built and tested together.
      - id: oss
        env:
          TOKEN: ${{ secrets.GANTRY_REPO_TOKEN || github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          git ls-remote --exit-code --heads "https://x-access-token:$TOKEN@github.com/${{ github.repository_owner }}/gantry.git" "$BRANCH" >/dev/null && ref=$BRANCH
          echo "gantry at $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gantry
          path: gantry
          ref: ${{ steps.oss.outputs.ref }}
          # The open source repository is private for now, and the default token reads only this one.
          # GANTRY_REPO_TOKEN: a fine-grained token with contents:read on ggantry/gantry.
          token: ${{ secrets.GANTRY_REPO_TOKEN || github.token }}
      - working-directory: gantry-enterprise
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked
          cargo test --all-features --locked
